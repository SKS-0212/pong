[package]
name = "pong"
version = "0.2.0"
edition = "2024"
description = "Classic Pong in Rust with a computer opponent that speeds up every rally."
repository = "https://github.com/SKS-0212/pong"
license = "MIT"

[dependencies]
macroquad = "0.4.16"

# Smaller wasm downloads. Safe for native builds too.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
